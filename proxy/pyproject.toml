[project]
name = "showcall-proxy"
version = "1.0.0"
description = "ShowCall migration gateway. All client traffic enters here; routes.yaml decides which backend serves each (route, org)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
